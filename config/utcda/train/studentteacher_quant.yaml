experiment:
  name: "StudentTeacherQuantization_VideoMAE"
  experiment_number: 0
  model_save_path: "./model"

data:
  name: "Custom"
  util_location: "framework_activity_recognition.datautils.prepare_custom"
  data_path: "./utcda_splitted/"
  train_split: "train_clip_front.csv"
  test_split:  "test_clip_front.csv"
  stride: 16
  sampler:
    use: True
    location: "framework_activity_recognition.sampler.ImbalancedDatasetSampler"
    parameter: {}
  n_frame: 16
  frame_size: 224

teacher:
  use: True
  location: "architecture.videomae.VideoMAETeacher"  # ← file mới cần tạo
  checkpoint: "checkpoint-29.pth"    # ← checkpoint VideoMAE của bạn
  num_classes: 7
  skip_replace_last_layer: True

student:
  location: "architecture.mobilenetquant.MobileNetLogit"
  width_mult: 0.5
  dropout_prob: 0.2
  pool:
    kernel: 1
    width: 7
    height: 7

pretraining:
  use: True
  path: "./pretrained/kinetics_mobilenet_0.5x_RGB_16_best.pth"
  student_model_num_classes: 600
  teacher_model_num_classes: 7
  fine_tune_only_last_layer: False

train:
  modality: "train_st_quant"
  epoch: 30
  criterion:
    name: "CrossEntropyLoss"
  optimizer:
    name: "SGD"
    parameter: {"lr": 0.001, "momentum": 0.9, "weight_decay": 0.00001}
  batch_size: 16
  num_workers: 4
  scheduler:
    use: True
    name: "MultiStepLR"
    parameter: {"milestones": [50, 100, 150], "gamma": 0.1}
  test_rate: 40
  quantization:
    use: True
    fuse_module: [['features.0.0', 'features.0.1', 'features.0.2'],
      ['features.1.conv1', 'features.1.bn1'], ['features.1.conv2', 'features.1.bn2'],
      ['features.2.conv1', 'features.2.bn1'], ['features.2.conv2', 'features.2.bn2'],
      ['features.3.conv1', 'features.3.bn1'], ['features.3.conv2', 'features.3.bn2'],
      ['features.4.conv1', 'features.4.bn1'], ['features.4.conv2', 'features.4.bn2'],
      ['features.5.conv1', 'features.5.bn1'], ['features.5.conv2', 'features.5.bn2'],
      ['features.6.conv1', 'features.6.bn1'], ['features.6.conv2', 'features.6.bn2'],
      ['features.7.conv1', 'features.7.bn1'], ['features.7.conv2', 'features.7.bn2'],
      ['features.8.conv1', 'features.8.bn1'], ['features.8.conv2', 'features.8.bn2'],
      ['features.9.conv1', 'features.9.bn1'], ['features.9.conv2', 'features.9.bn2'],
      ['features.10.conv1', 'features.10.bn1'], ['features.10.conv2', 'features.10.bn2'],
      ['features.11.conv1', 'features.11.bn1'], ['features.11.conv2', 'features.11.bn2'],
      ['features.12.conv1', 'features.12.bn1'], ['features.12.conv2', 'features.12.bn2'],
      ['features.13.conv1', 'features.13.bn1'], ['features.13.conv2', 'features.13.bn2']]
    backend: 'fbgemm'
    freeze_observer: 150
    freeze_bn: 150
  temperature: 3
  teacher_weight: 0.9
config:
  path: "./config/utcda/train/studentteacher_quant.yaml"