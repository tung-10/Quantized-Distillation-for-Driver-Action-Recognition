experiment:
  name: "MobileNetBaseline_UTCDA"
  model_save_path: "./model/rear/"
  experiment_number: 0

data:
  name: "UTCDA"
  util_location: "framework_activity_recognition.datautils.prepare_custom"
  data_path: "./utcda_splitted/"       # thư mục chứa file CSV
  train_split: "train_clip_rear.csv"
  test_split:  "test_clip_rear.csv"
  stride: 16                    # overlap = n_frame - stride = 16 frame
  sampler:
    use: True
    location: "framework_activity_recognition.sampler.OversampleMinorityClassSampler"
    parameter:
      oversample_factor: 5
      skip_classes: [0]
  n_frame: 16
  frame_size: 224

student:
  location: "architecture.mobilenet.MobileNetLogit"
  width_mult: 0.5
  dropout_prob: 0.2
  name: "inception"

pretraining:
  use: True
  path: "./pretrained/kinetics_mobilenet_0.5x_RGB_16_best.pth"
  model_num_classes: 600
  fine_tune_only_last_layer: False

train:
  modality: "train_baseline"
  epoch: 30
  criterion:
    name: "CrossEntropyLoss"
  optimizer:
    name: "SGD"
    parameter: {"lr": 0.001, "momentum": 0.9, "weight_decay": 0.00001}
  batch_size: 8        
  num_workers: 4
  scheduler:
    use: True
    name: "MultiStepLR"
    parameter: {"milestones": [10,20], "gamma": 0.2}
  test_rate: 5
  pin_memory: False
config:
  path: "./config/utcda/train/mobilenetbaseline.yaml"