data:
  name: "UTCDA"
  util_location: "framework_activity_recognition.datautils.prepare_custom_test"
  data_path: "./utcda_splitted/"
  test_split: "test_clip_front.csv"
  n_frame: 16
  stride: 16
  frame_size: 224
  
architecture:
  location: "architecture.mobilenetquant.MobileNetLogit"
  width_mult: 0.5 # 1.0 1.5
  dropout_prob: 0.2
  pool:
    kernel: 1
    width: 7
    height: 7
  model: "/mnt/data/quangtungbk/qd-driver-activity-reco/model/front/StudentTeacherQuantization_VideoMAE/exp1"

train:
  batch_size: 8
  num_workers: 4
  quantization:
    mode: "int"
    backend: 'fbgemm'
  pin_memory: False
