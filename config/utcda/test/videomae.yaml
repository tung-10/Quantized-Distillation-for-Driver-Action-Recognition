data:
  name: "UTCDA"
  util_location: "framework_activity_recognition.datautils.prepare_custom_test"
  data_path: "./utcda_splitted/"
  test_split: "test_clip_front.csv"
  n_frame: 16
  stride: 16
  frame_size: 224

architecture:
  location: "architecture.videomae.VideoMAELogit"
  modality: "rgb"
  dropout_prob: 0.5
  name: "vit_large"                              
  model: ./pretrained/utcda_front/

train:
  batch_size: 8 
  num_workers: 4
  pin_memory: False